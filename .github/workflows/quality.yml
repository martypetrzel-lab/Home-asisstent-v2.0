name: Kontrola aplikace
on: [push, pull_request]
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: pip install platformio==6.1.19
      - name: Enable cloud code for compile and size checks
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('firmware/arduino/HomeAssistant_ESP32_v2')
          (p / 'secrets.h').write_text((p / 'secrets.example.h').read_text().replace('#define HOME_CLOUD_TOKEN ""', '#define HOME_CLOUD_TOKEN "compile-test-only-000000000000000000000000"'))
          PY
      - run: pio run -d firmware
      - run: pio run -d firmware -t buildfs
      - run: node scripts/test-firmware-core.mjs
  arduino:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Enable cloud code for compile and size checks
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('firmware/arduino/HomeAssistant_ESP32_v2')
          (p / 'secrets.h').write_text((p / 'secrets.example.h').read_text().replace('#define HOME_CLOUD_TOKEN ""', '#define HOME_CLOUD_TOKEN "compile-test-only-000000000000000000000000"'))
          PY
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.5.0"
      - run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.8 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install "ArduinoJson@7.4.3" "DHT sensor library@1.4.7" "Adafruit INA219@1.2.3" "Adafruit Unified Sensor@1.1.15" "Adafruit BusIO@1.17.4"
          arduino-cli compile --jobs 4 --fqbn esp32:esp32:esp32 firmware/arduino/HomeAssistant_ESP32_v2
